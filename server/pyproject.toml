[project]
name = "mediareview-server"
version = "1.2.1"
description = "MediaReview 中间层服务(FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0.41",
    "alembic>=1.13",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4"]
ignore = [
    "S101",   # 测试中允许 assert
    "B008",   # FastAPI Depends() 在参数默认值中是框架惯用法
]

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/*" = ["E501", "W291"]
"app/admin.py" = ["E501"]  # 内联 HTML 页面存在较长行
"tests/*" = ["S", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
